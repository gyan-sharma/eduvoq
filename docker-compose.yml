services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: eduvoq
      MYSQL_USER: eduvoq
      MYSQL_PASSWORD: eduvoq
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniopass
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

  app:
    build: .
    environment:
      DATABASE_URL: mysql://eduvoq:eduvoq@mysql:3306/eduvoq
      AUTH_SECRET: ${AUTH_SECRET:-devsecret-change-me-not-for-prod}
      # Override via .env AUTH_URL (Caddy :80 → http://localhost).
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      EMAIL_FROM: ${EMAIL_FROM:-hello@eduvoq.com}
      CRON_SECRET: ${CRON_SECRET:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PORT: 3000
      FILE_DRIVER: s3
      FILE_LOCAL_ROOT: /app/storage
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: eduvoq
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: miniopass
      S3_FORCE_PATH_STYLE: "true"
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_started
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

  caddy:
    image: caddy:2
    volumes:
      - ./caddy/Caddyfile.local:/etc/caddy/Caddyfile
    ports:
      - "80:80"
    depends_on:
      app:
        condition: service_healthy

volumes:
  mysql_data:
  minio_data:
